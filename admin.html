<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alle Antworten</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f2a28;
    color: #0f2a28;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card { max-width: 400px; width: 100%; color: #f4ede0; text-align: center; }
  .login-card .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #c98a4b; margin-bottom: 14px; }
  .login-card h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; margin: 0 0 14px; }
  .login-card p.lead { color: rgba(244,237,224,0.7); font-size: 15px; margin-bottom: 32px; }
  .login-card input {
    width: 100%; background: transparent; border: none;
    border-bottom: 2px solid rgba(244,237,224,0.25);
    color: #f4ede0; font-size: 22px; padding: 10px 0; outline: none;
    text-align: center; margin-bottom: 8px;
  }
  .login-card input:focus { border-color: #c98a4b; }
  .error-msg { color: #e07a5f; font-size: 13px; height: 18px; margin-bottom: 20px; }
  .btn-primary {
    background: #c98a4b; color: #0f2a28; border: none;
    font-weight: 600; font-size: 15px; padding: 14px 26px;
    border-radius: 999px; cursor: pointer; transition: background 0.2s;
  }
  .btn-primary:hover { background: #e0a562; }
  .hint { font-size: 12px; color: rgba(244,237,224,0.35); margin-top: 22px; }
  a.back-link { display: inline-block; margin-top: 18px; font-size: 12px; color: rgba(244,237,224,0.4); text-decoration: none; }
  a.back-link:hover { color: rgba(244,237,224,0.8); }

  .result-wrap {
    max-width: 760px; width: 100%; background: #f4ede0;
    border-radius: 20px; padding: 36px; box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }
  .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .result-header h1 { font-family: Georgia, serif; font-size: 26px; margin: 0; }
  .count-badge { background: #c98a4b; color: #0f2a28; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .entries { display: flex; flex-direction: column; gap: 14px; max-height: 65vh; overflow-y: auto; }
  .entry-card { background: white; border: 1px solid rgba(15,42,40,0.08); border-radius: 14px; padding: 18px 20px; }
  .entry-time { font-size: 12px; color: rgba(15,42,40,0.4); margin-bottom: 10px; }
  .entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; font-size: 14px; }
  .entry-grid .k { color: rgba(15,42,40,0.45); }
  .entry-grid .v { font-weight: 600; text-transform: capitalize; }
  .empty-msg { color: rgba(15,42,40,0.45); font-size: 14px; text-align: center; padding: 40px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="viewLogin" class="login-card">
  <p class="eyebrow">Geschützter Bereich</p>
  <h1>🔒 Alle Antworten</h1>
  <p class="lead">Bitte gib das Passwort ein, um die gesammelten Antworten zu sehen.</p>
  <input type="password" id="passwordInput" placeholder="Passwort" autofocus>
  <p class="error-msg" id="errorMsg"></p>
  <button class="btn-primary" onclick="checkPassword()">Entsperren</button>
  <p class="hint">Standard-Passwort: 1234 (per ADMIN_PASSWORD änderbar)</p>
  <br>
  <a href="/" class="back-link">← Zurück zum Formular</a>
</div>

<div id="viewResults" class="result-wrap hidden">
  <div class="result-header">
    <h1>Gesammelte Antworten</h1>
    <span class="count-badge" id="countBadge">0</span>
  </div>
  <div class="entries" id="entriesList"></div>
</div>

<script>
  const FIELD_LABELS = { name: "Name", age: "Alter", hobby: "Hobby", pets: "Haustier", travel: "Reist gerne" };

  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  async function checkPassword() {
    const password = document.getElementById('passwordInput').value;
    const errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    try {
      const res = await fetch('/api/entries/list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      if (res.status === 401) {
        errorEl.textContent = 'Falsches Passwort. Bitte versuche es erneut.';
        return;
      }
      if (!res.ok) throw new Error('Serverfehler');

      const data = await res.json();
      document.getElementById('viewLogin').classList.add('hidden');
      document.getElementById('viewResults').classList.remove('hidden');
      renderEntries(data.entries || []);
    } catch (err) {
      console.error(err);
      errorEl.textContent = 'Verbindung zum Server fehlgeschlagen.';
    }
  }

  function renderEntries(entries) {
    document.getElementById('countBadge').textContent = entries.length;
    const list = document.getElementById('entriesList');

    if (entries.length === 0) {
      list.innerHTML = '<p class="empty-msg">Noch keine Antworten vorhanden.</p>';
      return;
    }

    list.innerHTML = '';
    entries.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'entry-card';

      const time = document.createElement('div');
      time.className = 'entry-time';
      time.textContent = entry.submitted_at ? new Date(entry.submitted_at).toLocaleString('de-DE') : '';
      card.appendChild(time);

      const grid = document.createElement('div');
      grid.className = 'entry-grid';
      Object.entries(FIELD_LABELS).forEach(([key, label]) => {
        const k = document.createElement('div');
        k.className = 'k';
        k.textContent = label + ':';
        const v = document.createElement('div');
        v.className = 'v';
        v.textContent = entry[key] || '–';
        grid.appendChild(k);
        grid.appendChild(v);
      });
      card.appendChild(grid);

      list.appendChild(card);
    });
  }
</script>

</body>
</html>
